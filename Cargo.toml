[package]
name = "glassmon"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
authors = ["glassmon contributors"]
description = "A fast, good-looking terminal system monitor for macOS and Linux with a Liquid Glass inspired UI"
license = "MIT OR Apache-2.0"
repository = "https://github.com/7assanyahya/glassmon"
homepage = "https://github.com/7assanyahya/glassmon"
documentation = "https://github.com/7assanyahya/glassmon#readme"
readme = "README.md"
keywords = ["tui", "system-monitor", "ratatui", "macos", "linux"]
categories = ["command-line-utilities", "visualization"]
exclude = [
    "/.github/",
    "/tests/fixtures/",
    "/docs/img/",
    "/packaging/",
    "/.editorconfig",
]

[dependencies]
anyhow = "1.0"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive"] }
dirs = "6"
ratatui = { version = "0.30", default-features = false, features = ["crossterm"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
starship-battery = "0.10"
sysinfo = { version = "0.38", default-features = false, features = ["component", "disk", "network", "system", "user"] }
thiserror = "2.0"
toml = { version = "1.1", default-features = false, features = ["parse", "serde", "display"] }

[target.'cfg(unix)'.dependencies]
rustix = { version = "1", default-features = false, features = ["std", "process"] }

[dev-dependencies]
insta = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
